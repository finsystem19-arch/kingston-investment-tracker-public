<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turn the Paper Kaleidoscope</title>
<style>
:root{--ink:#2f2230;--paper:#f6ead8;--rust:#c4583c;--gold:#e2b455;--teal:#3d7f7a;--plum:#7a4668}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#e6d2b7;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;display:grid;place-items:center;padding:18px}
main{width:min(960px,100%);background:var(--paper);border:1px solid #8d735d;border-radius:26px;box-shadow:0 18px 50px #3b241c28;overflow:hidden}
header{padding:20px 24px 8px;display:flex;gap:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
h1{font-size:clamp(1.45rem,4vw,2.4rem);margin:0;letter-spacing:-.03em}
.kicker{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800;opacity:.68}
.stage{padding:0 18px}
svg{width:100%;height:auto;display:block;max-height:68vh}
.controls{border-top:1px solid #bda68e;padding:16px 24px 22px;display:grid;grid-template-columns:minmax(220px,1fr) minmax(250px,1.4fr);gap:18px;align-items:center}
.control-box{background:#fff8ec;border:1px solid #c7ad91;border-radius:18px;padding:14px 16px;box-shadow:inset 0 0 0 4px #fffaf1}
label{display:block;font-weight:800;margin-bottom:8px}
.range-row{display:flex;align-items:center;gap:12px}
input[type=range]{width:100%;accent-color:var(--rust)}
input[type=range]:focus-visible{outline:4px solid #2b6f69;outline-offset:4px;border-radius:8px}
.value{min-width:3.2rem;text-align:center;font-variant-numeric:tabular-nums;font-weight:900;background:#2f2230;color:white;border-radius:999px;padding:5px 10px}
.explain{font-size:.98rem;line-height:1.45;margin:0}
@media(max-width:620px){body{padding:8px}.controls{grid-template-columns:1fr;padding:14px 16px 18px}.stage{padding:0 8px}header{padding:16px 16px 6px}}
</style>
</head>
<body>
<main>
<header>
  <div>
    <div class="kicker">six cuts · one turning rule</div>
    <h1>Turn the Paper Kaleidoscope</h1>
  </div>
</header>

<div class="stage">
<svg viewBox="0 0 800 660" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">Sixfold paper-cut kaleidoscope</title>
<desc id="art-desc">Six identical asymmetric paper motifs are rotated by sixty-degree steps around a shared centre. A single slider changes their radial spread.</desc>

<defs>
  <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#5a3d2e" flood-opacity=".24"/>
  </filter>
  <pattern id="fiber" width="16" height="16" patternUnits="userSpaceOnUse">
    <path d="M1 12L8 9M11 3l4 2M4 2l2 1" stroke="#6e5545" stroke-opacity=".08" stroke-width="1"/>
  </pattern>

  <!-- One deliberately asymmetric base motif. The slider changes only this
       shared group's radial translation; every <use> therefore changes equally. -->
  <g id="motif">
    <g id="motif-inner" transform="translate(0,-190)">
      <path d="M-34 36 C-64 12 -55 -35 -9 -80 L18 -112 L26 -63 C53 -45 60 -9 41 14 C25 34 0 46 -34 36Z"
            fill="#c4583c" stroke="#5f302d" stroke-width="4"/>
      <path d="M-19 -6 C-7 -31 17 -42 34 -29 C44 -19 42 0 29 11 C14 24 -6 20 -19 -6Z"
            fill="#e2b455" stroke="#68492c" stroke-width="3"/>
      <path d="M-42 29 L-9 20 L-20 52 Z" fill="#3d7f7a" stroke="#294f4c" stroke-width="3"/>
      <circle cx="5" cy="-71" r="10" fill="#7a4668" stroke="#4a2f42" stroke-width="3"/>
      <path d="M-3 -92 L10 -82 L-8 -77 Z" fill="#f6ead8"/>
    </g>
  </g>
</defs>

<!-- fixed paper theatre -->
<rect x="20" y="20" width="760" height="620" rx="34" fill="#f1ddbd" stroke="#8d735d" stroke-width="2"/>
<rect x="20" y="20" width="760" height="620" rx="34" fill="url(#fiber)"/>
<circle cx="400" cy="320" r="248" fill="none" stroke="#7a4668" stroke-opacity=".20" stroke-width="2" stroke-dasharray="4 14"/>
<circle cx="400" cy="320" r="112" fill="#f6ead8" stroke="#8d735d" stroke-width="2" filter="url(#paperShadow)"/>
<path d="M400 228L414 303L488 320L414 337L400 412L386 337L312 320L386 303Z"
      fill="#3d7f7a" opacity=".20"/>

<g transform="translate(400 320)" filter="url(#paperShadow)">
  <use href="#motif" transform="rotate(0)"/>
  <use href="#motif" transform="rotate(60)"/>
  <use href="#motif" transform="rotate(120)"/>
  <use href="#motif" transform="rotate(180)"/>
  <use href="#motif" transform="rotate(240)"/>
  <use href="#motif" transform="rotate(300)"/>
</g>

<circle cx="400" cy="320" r="28" fill="#e2b455" stroke="#68492c" stroke-width="4"/>
<circle cx="400" cy="320" r="9" fill="#7a4668"/>
</svg>
</div>

<section class="controls">
  <div class="control-box">
    <label for="spread">Paper spread</label>
    <div class="range-row">
      <input id="spread" type="range" min="0" max="100" step="1" value="50">
      <output id="value" class="value" for="spread">50</output>
    </div>
  </div>
  <p class="explain">One asymmetric paper motif is copied six times, each copy rotated exactly 60°. The control changes the motif’s radial distance from the shared centre, so all six pieces move together while the rotational symmetry stays exact.</p>
</section>
</main>

<script>
const slider=document.getElementById('spread');
const out=document.getElementById('value');
const inner=document.getElementById('motif-inner');
function update(){
  const v=Number(slider.value);
  const r=85+(v*0.90);
  inner.setAttribute('transform',`translate(0,-${r.toFixed(2)})`);
  out.value=String(v);
  out.textContent=String(v);
}
slider.addEventListener('input',update);
update();
</script>
</body>
</html>
