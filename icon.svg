<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Kaleb Investment App icon</title>
  <desc id="desc">Dark rounded app tile with a gold Larry O'Brien style trophy, a large K on the body, and a dollar sign inside the basketball on top.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="38%" stop-color="#0b1422"/>
      <stop offset="100%" stop-color="#071733"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="44%" cy="12%" r="88%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".11"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2bf"/>
      <stop offset="22%" stop-color="#ffd86c"/>
      <stop offset="55%" stop-color="#f0b52a"/>
      <stop offset="100%" stop-color="#8a5600"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7db"/>
      <stop offset="100%" stop-color="#f4c54d"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d79a1b"/>
      <stop offset="100%" stop-color="#5a3600"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="45%" stop-color="#f3d26a"/>
      <stop offset="100%" stop-color="#b07605"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000000" flood-opacity=".58"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity=".26"/>
    </filter>
  </defs>

  <rect x="52" y="52" width="920" height="920" rx="184" fill="url(#bg)"/>
  <rect x="52" y="52" width="920" height="920" rx="184" fill="url(#bgGlow)"/>
  <rect x="82" y="82" width="860" height="860" rx="154" fill="none" stroke="rgba(255, 215, 115, 0.16)" stroke-width="2"/>

  <g filter="url(#shadow)">
    <ellipse cx="512" cy="795" rx="130" ry="24" fill="#000" opacity=".34"/>

    <!-- top basketball -->
    <g transform="translate(0 4)">
      <circle cx="512" cy="198" r="66" fill="url(#goldSoft)"/>
      <circle cx="512" cy="198" r="66" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>
      <path d="M479 164 C500 180 510 189 510 198 C510 207 500 216 479 232" fill="none" stroke="#3a2500" stroke-width="7" stroke-linecap="round"/>
      <path d="M545 164 C524 180 514 189 514 198 C514 207 524 216 545 232" fill="none" stroke="#3a2500" stroke-width="7" stroke-linecap="round"/>
      <path d="M476 198 C494 190 530 190 548 198" fill="none" stroke="#3a2500" stroke-width="7" stroke-linecap="round"/>
      <path d="M512 164 C506 183 506 213 512 232" fill="none" stroke="#3a2500" stroke-width="7" stroke-linecap="round"/>
      <text x="512" y="203" text-anchor="middle" dominant-baseline="middle" font-family="Arial Black, Helvetica, Arial, sans-serif" font-size="50" font-weight="900" fill="#201300" stroke="#f8d56a" stroke-width="3" paint-order="stroke fill">$</text>
    </g>

    <!-- body -->
    <path d="M467 270
             L557 270
             L582 336
             L584 554
             C584 605 552 648 512 652
             C472 648 440 605 440 554
             L442 336
             Z"
          fill="url(#goldSoft)"/>
    <path d="M467 270
             L557 270
             L582 336
             L584 554
             C584 605 552 648 512 652
             C472 648 440 605 440 554
             L442 336
             Z"
          fill="none" stroke="rgba(250, 235, 170, 0.6)" stroke-width="4"/>
    <path d="M470 282 L553 282 L575 338 L578 548 C578 595 548 633 512 638 C476 633 446 595 446 548 L449 338 Z"
          fill="none" stroke="#5f4200" stroke-opacity=".18" stroke-width="3"/>

    <!-- K body -->
    <path d="M488 300
             L538 300
             L538 620
             L488 620 Z"
          fill="#101424" opacity=".98"/>
    <path d="M488 300 L538 300" fill="none" stroke="rgba(255, 232, 153, 0.72)" stroke-width="5" stroke-linecap="round"/>
    <path d="M488 620 L538 620" fill="none" stroke="rgba(255, 232, 153, 0.56)" stroke-width="5" stroke-linecap="round"/>

    <path d="M487 318
             L515 318
             L515 405
             L550 318
             L582 318
             L532 424
             L586 535
             L552 535
             L516 456
             L516 535
             L487 535 Z"
          fill="url(#gold)"/>
    <path d="M487 318
             L515 318
             L515 405
             L550 318
             L582 318
             L532 424
             L586 535
             L552 535
             L516 456
             L516 535
             L487 535 Z"
          fill="none" stroke="rgba(64, 40, 0, 0.34)" stroke-width="3"/>

    <!-- lower symbol -->
    <circle cx="512" cy="560" r="37" fill="#1b2134" opacity=".96"/>
    <circle cx="512" cy="560" r="37" fill="none" stroke="rgba(255, 227, 140, .72)" stroke-width="4"/>
    <text x="512" y="569" text-anchor="middle" dominant-baseline="middle" font-family="Arial Black, Helvetica, Arial, sans-serif" font-size="47" font-weight="900" fill="#f6cf5d" stroke="#2a1b00" stroke-width="3" paint-order="stroke fill">$</text>

    <!-- base -->
    <path d="M370 642
             L654 642
             C675 642 692 659 692 680
             L692 706
             C692 731 672 750 647 750
             L377 750
             C352 750 332 731 332 706
             L332 680
             C332 659 349 642 370 642
             Z"
          fill="url(#gold)"/>
    <path d="M392 704 L632 704 C646 704 657 715 657 729 L657 739 C657 748 650 755 641 755 L383 755 C374 755 367 748 367 739 L367 729 C367 715 378 704 392 704 Z"
          fill="url(#goldDark)"/>
    <rect x="350" y="650" width="324" height="42" rx="21" fill="rgba(255,255,255,0.22)" opacity=".28"/>
    <rect x="383" y="669" width="258" height="22" rx="11" fill="#8a5600" opacity=".35"/>
  </g>
</svg>
